<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="TOKCER storefront for instant token packages."
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="img/Tokped-ICO.webp"
      sizes="16x16"
    />
    <title>TOKCER</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="image"
      href="img/Tokopedia-Clay-Style.webp"
      fetchpriority="high"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Work+Sans:wght@700;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Work+Sans:wght@700;900&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="announcement" role="status">
      Model terbaru Opus 5 Ready di Tokcer! Yukk Gasken
    </div>

    <div class="viewport">
      <div class="page">
        <header class="top-nav">
          <a href="index.html" class="logo" aria-label="TOKCER homepage"
            >TOKCER</a
          >

          <nav class="menu" aria-label="Primary">
            <a class="pill active" href="index.html">TOKO</a>
            <a class="pill" href="page/tokopedia.html">CEK STATUS</a>
            <a class="pill" href="page/shopee.html">CARA PAKAI</a>
            <a class="pill" href="#">BLOG</a>
          </nav>
        </header>

        <main>
          <section class="hero frame" aria-labelledby="heroHeading">
            <div class="hero-copy">
              <p class="hero-kicker">TOKCER</p>
              <h1 id="heroHeading">TOKen eCERan</h1>
              <p class="hero-subtitle">
                Pilih paket, bayar pake QRIS, langsung dapat key.
              </p>
            </div>
            <img
              src="img/Tokopedia-Clay-Style.webp"
              width="112"
              height="112"
              fetchpriority="high"
              decoding="async"
              alt="TOKCER mascot"
              class="hero-mascot"
            />
          </section>

          <section
            aria-label="Product list"
            id="productGrid"
            class="product-grid"
          ></section>
        </main>

        <!-- <footer class="page-footer">
        <small>© 2026 TOKCER</small>
        <nav aria-label="Footer links">
          <a href="index.html">TOKO</a>
          <a href="page/tokopedia.html">CEK STATUS</a>
          <a href="page/shopee.html">CARA PAKAI</a>
          <a href="#">BLOG</a>
        </nav>
      </footer> -->
      </div>
    </div>

    <script src="js/script.js" defer></script>
  </body>
</html>
