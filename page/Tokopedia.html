<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curated Finds</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  body{ background:#0f172a; } /* slate-900 */
</style>
</head>
<body class="min-h-screen">

<!-- Main Mobile Container -->
<main class="max-w-md mx-auto px-4 pb-12 pt-6 w-full">

  <h1 class="text-slate-100 text-lg font-bold mb-3">Curated Finds</h1>

  <!-- Search -->
  <input
    id="searchInput"
    type="text"
    placeholder="Search by number or name..."
    class="w-full mb-3 px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-teal-500"
  />

  <!-- Category Filter Tabs (auto-generated from sheet data) -->
  <div class="flex space-x-2 overflow-x-auto pb-3 no-scrollbar snap-x" id="categoryTabs"></div>

  <!-- Table header, styled like the spreadsheet -->
  <div class="grid grid-cols-[34px_1fr_1fr_60px] gap-2 items-center px-3 py-2 rounded-t-xl bg-teal-800 text-[10px] font-bold text-teal-100 uppercase tracking-wide">
    <div class="text-center">No.</div>
    <div>Category</div>
    <div>Name</div>
    <div class="text-center">Link</div>
  </div>

  <!-- Rows get injected here -->
  <div id="linksGrid" class="bg-slate-800/30 rounded-b-xl overflow-hidden">
    <div class="text-center text-xs text-slate-500 py-8" id="loadingState">Loading curated finds... ⏳</div>
  </div>

</main>

<script>
  // 🔗 PASTE YOUR PUBLISHED GOOGLE SHEET CSV LINK HERE
  const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRMSVSL-88iVwW3uH0JQdTYIVWUkwMOs-_xfVh1c2RGY5qhAFDlP_SJlY2nw8P3c5dDimDYuMku6DGR/pub?gid=979915917&single=true&output=csv';

  let allProducts = [];
  let currentCategory = 'all';

  // ---- 1. Proper CSV parser (handles quotes, commas inside fields, blank rows) ----
  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

    const rows = [];
    let row = [], field = '', inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else {
          field += c;
        }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else field += c;
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }

    const rawHeaders = rows.shift().map(h => h.trim().toLowerCase());

    return rows
      .filter(r => r.some(v => v.trim() !== ''))
      .map(r => {
        const obj = {};
        rawHeaders.forEach((h, idx) => { obj[h] = (r[idx] || '').trim(); });
        return obj;
      });
  }

  // ---- 2. Fetch + parse the sheet ----
  async function loadStorefrontData() {
    // fetch() to a remote URL is blocked by browsers when the page itself is
    // opened as a local file:// path. Serve this through an actual server
    // (localhost, GitHub Pages, Netlify, etc.) or the sync will always fail.
    if (location.protocol === 'file:') {
      document.getElementById('linksGrid').innerHTML = `
        <div class="text-center text-xs text-red-400 py-8 px-4 leading-relaxed">
          This page was opened directly as a file (file://).<br>
          Browsers block loading remote data that way.<br>
          Run it through a local server or host it online instead. ⚠️
        </div>`;
      return;
    }

    try {
      // cache-busting param so browsers don't serve a stale copy
      const url = SPREADSHEET_CSV_URL + (SPREADSHEET_CSV_URL.includes('?') ? '&' : '?') + 'cb=' + Date.now();
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Sheet request failed with status ${response.status}`);
      }

      const csvText = await response.text();

      // If the sheet isn't actually published (or the gid is wrong),
      // Google returns an HTML page instead of CSV — catch that early.
      if (csvText.trim().startsWith('<')) {
        throw new Error('Response was HTML, not CSV — sheet may not be published, or the link/gid is wrong.');
      }

      allProducts = parseCSV(csvText);
      renderCategoryTabs(allProducts);
      applyFilters();
    } catch (error) {
      console.error('Error loading dynamic database:', error);
      document.getElementById('linksGrid').innerHTML = `
        <div class="text-center text-xs text-red-400 py-8 px-4 leading-relaxed">
          Failed to sync database. ⚠️<br>
          Check console for details — common causes: sheet not published to web,
          wrong gid, or page opened via file:// instead of a server.
        </div>`;
    }
  }

  // ---- 3. Render category tabs dynamically (no more hardcoding new categories) ----
  function renderCategoryTabs(products) {
    const categories = ['all', ...new Set(
      products.map(p => (p.category || '').toLowerCase()).filter(Boolean)
    )];

    const tabsContainer = document.getElementById('categoryTabs');
    tabsContainer.innerHTML = categories.map(cat => {
      const label = cat === 'all' ? 'All Finds 🌐' : cat.replace(/\b\w/g, c => c.toUpperCase());
      const activeClasses = cat === 'all'
        ? 'bg-teal-500 text-slate-900 shadow-sm shadow-teal-500/10'
        : 'bg-slate-800 text-slate-400 hover:text-slate-200';
      return `<button data-category="${cat}" class="cat-btn snap-start shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold ${activeClasses}">${label}</button>`;
    }).join('');

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCategory = btn.dataset.category;
        document.querySelectorAll('.cat-btn').forEach(b => {
          b.classList.remove('bg-teal-500', 'text-slate-900', 'shadow-teal-500/10');
          b.classList.add('bg-slate-800', 'text-slate-400');
        });
        btn.classList.remove('bg-slate-800', 'text-slate-400');
        btn.classList.add('bg-teal-500', 'text-slate-900', 'shadow-teal-500/10');
        applyFilters();
      });
    });
  }

  // ---- 4. Render table rows ----
  function renderRows(list) {
    const container = document.getElementById('linksGrid');
    container.innerHTML = '';

    if (list.length === 0) {
      container.innerHTML = `<div class="text-center text-xs text-slate-500 py-8">No matching items found 🔍</div>`;
      return;
    }

    list.forEach(item => {
      const rowHTML = `
        <div class="grid grid-cols-[34px_1fr_1fr_60px] gap-2 items-center px-3 py-2.5 border-b border-slate-800/80 last:border-b-0 hover:bg-slate-800/50 transition-colors">
          <div class="text-xs text-slate-500 font-mono text-center">${item.number || ''}</div>
          <div>
            <span class="inline-block bg-teal-500/10 text-teal-400 text-[9px] font-semibold px-2 py-0.5 rounded-full uppercase tracking-wide leading-tight">
              ${item.category || '—'}
            </span>
          </div>
          <div class="text-xs font-semibold text-slate-200 leading-snug line-clamp-2">${item.name || ''}</div>
          <a href="${item.link || '#'}" target="_blank" rel="noopener noreferrer"
             class="text-center bg-teal-500/10 hover:bg-teal-500 border border-teal-500/20 text-teal-400 hover:text-slate-900 font-bold text-[10px] py-1.5 rounded-lg transition-all">
            View
          </a>
        </div>`;
      container.insertAdjacentHTML('beforeend', rowHTML);
    });
  }

  // ---- 5. Search (matches Number or Name) + category filter combined ----
  function applyFilters() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();

    const filtered = allProducts.filter(item => {
      const matchesCategory = currentCategory === 'all' || (item.category || '').toLowerCase() === currentCategory;
      const matchesSearch =
        query === '' ||
        String(item.number || '').toLowerCase().includes(query) ||
        String(item.name || '').toLowerCase().includes(query);
      return matchesCategory && matchesSearch;
    });

    renderRows(filtered);
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);

  // Optional: re-fetch every 5 minutes so new sheet rows show up without a manual reload.
  // Remove this line if you'd rather rely on a plain page refresh.
  setInterval(loadStorefrontData, 5 * 60 * 1000);

  window.addEventListener('DOMContentLoaded', loadStorefrontData);
</script>

</body>
</html>
