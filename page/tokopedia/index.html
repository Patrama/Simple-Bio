<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/x-icon"
      href="img/Tokped-ICO.webp"
      sizes="16x16"
    />
    <title>GOAT Tokopedia</title>

    <!-- Must load before CSS paints to avoid a flash of the wrong theme -->
    <script src="js/theme-init.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="min-h-screen">
    <!-- Main Mobile Container -->
    <div class="viewport" id="viewport">
      <main id="fitMain" class="max-w-md mx-auto px-4 pb-12 pt-6 w-full">
        <div class="flex items-center justify-between mb-3">
          <h1 class="text-[var(--text-primary)] text-lg font-bold">
            GOAT Tokopedia
          </h1>

          <!-- Theme toggle -->
          <button
            id="themeToggle"
            aria-label="Toggle light/dark theme"
            class="w-8 h-8 flex items-center justify-center rounded-full bg-[var(--surface-alt)] border border-[var(--border)] text-[var(--text-secondary)] hover:text-[var(--accent)] hover:border-[var(--accent)] transition-colors"
          >
            <!-- Sun icon -->
            <svg
              id="iconSun"
              class="w-4 h-4 hidden"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
            <!-- Moon icon -->
            <svg
              id="iconMoon"
              class="w-4 h-4 hidden"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>

        <!-- Search -->
        <input
          id="searchInput"
          type="text"
          placeholder="Search by number or name..."
          class="w-full mb-3 px-3 py-2 rounded-xl bg-[var(--surface)] border border-[var(--border)] text-xs text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none focus:border-[var(--accent)]"
        />

        <!-- Category Filter Tabs (auto-generated from sheet data) -->
        <div
          class="flex space-x-2 overflow-x-auto pb-3 no-scrollbar snap-x"
          id="categoryTabs"
        ></div>

        <!-- Table header, styled like the spreadsheet -->
        <div
          class="grid grid-cols-[34px_1fr_1fr_60px] gap-2 items-center px-3 py-2 rounded-t-xl bg-[var(--accent-soft)] text-[10px] font-bold text-[var(--badge-text)] uppercase tracking-wide"
        >
          <div class="text-center">No.</div>
          <div>Category</div>
          <div>Name</div>
          <div class="text-center">Link</div>
        </div>

        <!-- Rows get injected here -->
        <div
          id="linksGrid"
          class="bg-[var(--surface)] border border-t-0 border-[var(--border)] rounded-b-xl overflow-hidden"
        >
          <div
            class="text-center text-xs text-[var(--text-secondary)] py-8"
            id="loadingState"
          >
            Loading curated finds... ⏳
          </div>
        </div>
      </main>
    </div>

    <script src="other/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/data.js"></script>
    <script src="js/viewport-fit.js"></script>
  </body>
</html>
